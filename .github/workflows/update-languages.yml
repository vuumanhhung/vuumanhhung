name: Update language statistics (public + private)

on:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'
  push:
    paths:
      - '.github/workflows/update-languages.yml'
      - 'scripts/update_languages.py'

permissions:
  contents: write

concurrency:
  group: profile-language-stats
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out profile repository
        uses: actions/checkout@v4
      - name: Build language statistics
        env:
          PROFILE_STATS_TOKEN: ${{ secrets.PROFILE_STATS_TOKEN }}
        run: python3 scripts/update_languages.py
      - name: Commit changed README
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md
          if ! git diff --cached --quiet; then
            git commit -m 'chore: update language statistics'
            git push
          fi
